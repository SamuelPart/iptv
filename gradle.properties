# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvm.options="-Xmx1536m"
# AGP 8.6 fue probado hasta API 35; compilamos contra 36 de forma intencional (Play lo exige)
android.suppressUnsupportedCompileSdk=36
# Fijar el JDK de Gradle al JBR embebido de Android Studio (Java 17/21).
# Evita que el daemon arranque con el Java 25 del sistema, que el compilador
# Kotlin de Gradle 8.7 no soporta ("Incompatible Gradle JVM version: 25.0.3").
# Si mueves Android Studio de ruta, actualiza esta linea.
org.gradle.java.home=/opt/android-studio/jbr
